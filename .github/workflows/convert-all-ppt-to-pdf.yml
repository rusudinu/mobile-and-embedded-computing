name: Convert All PowerPoint to PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-all-to-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Find and convert all PowerPoint files
        run: |
          # Create output directories
          mkdir -p lectures-pdf labs-pdf

          # Find all .ppt and .pptx files in lectures and labs directories
          find lectures labs -type f \( -name "*.ppt" -o -name "*.pptx" \) | while IFS= read -r file; do
            filename=$(basename "$file")
            name="${filename%.*}"
            
            # Determine output directory
            if [[ "$file" == lectures/* ]]; then
                outdir="lectures-pdf"
            elif [[ "$file" == labs/* ]]; then
                outdir="labs-pdf"
            else
                echo "Skipping $file (not in target directories)"
                continue
            fi

            echo "Converting $file to PDF in $outdir..."

            # Convert to PDF using LibreOffice
            libreoffice --headless --convert-to pdf --outdir "$outdir" "$file"

            echo "Created ${outdir}/${name}.pdf"
          done

      - name: Commit PDF files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Add all PDF files in output directories
          git add lectures-pdf labs-pdf

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "Auto-generate PDFs from all PowerPoint files"
            git push
          fi
