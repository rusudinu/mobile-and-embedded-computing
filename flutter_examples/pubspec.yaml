name: flutter_examples
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  # HTTP libraries
  http: ^1.1.0              # Simple HTTP client with RetryClient support
  dio: ^5.4.0               # Feature-rich HTTP client with interceptors
  chopper: ^7.1.0           # Declarative REST API client
  retrofit: ^4.0.0          # Type-safe REST API client with annotations
  json_annotation: ^4.8.0   # JSON serialization annotations

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Code generation
  build_runner: ^2.4.0           # Build system for Dart code generation
  chopper_generator: ^7.1.0      # Code generator for Chopper
  retrofit_generator: ^8.0.0     # Code generator for Retrofit
  json_serializable: ^6.7.0      # JSON serialization code generator

flutter:
  uses-material-design: true
